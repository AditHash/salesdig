  <title>Salesdig — Company Intelligence for Sales</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary-glow: conic-gradient(from 180deg at 50% 50%, #14b8a6 0deg, #06b6d4 70deg, #2dd4bf 135deg, #14b8a6 180deg, transparent 360deg);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f3f4f6;
      min-height: 100vh;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Animated Mesh Background */
    .mesh-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background:
        radial-gradient(at 0% 0%, hsla(190, 75%, 10%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(200, 50%, 28%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(170, 55%, 24%, 1) 0, transparent 50%);
      background-color: #f8fafc;
      /* Fallback light color */
      background-image:
        radial-gradient(at 40% 20%, rgba(20, 184, 166, 0.1) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
        radial-gradient(at 0% 50%, rgba(45, 212, 191, 0.05) 0px, transparent 50%);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-pulse-slow {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .7;
      }
    }

    /* Modern Card & Glass Styles */
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .pro-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(226, 232, 240, 0.6);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pro-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(20, 184, 166, 0.3);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    }

    .text-gradient {
      background: linear-gradient(135deg, #0f766e 0%, #0891b2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Scrollbar utilities */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @media print {

      .mesh-bg,
      .glass-header,
      .print\:hidden {
        display: none !important;
      }

      body {
        background-color: white;
        color: black;
      }

      .pro-card {
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        background: white !important;
        break-inside: avoid;
      }

      /* Ensure layout is vertical */
      .flex-col {
        display: block !important;
      }
    }
  </style>
